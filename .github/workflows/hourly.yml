name: market-scanner

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "state.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify critical behavior
        if: ${{ hashFiles('tests/test_scanner.py') != '' }}
        run: python -m unittest discover -s tests -v

      - name: Apply reviewed patches
        run: python upgrade_agent.py

      - name: Run paper scanner continuously
        run: python continuous_scanner.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          EVENT: ${{ github.event_name }}

          LOOP_SCANS: "5"
          SCAN_INTERVAL_SECONDS: "180"

          GOLD_PROVIDER: twelve
          GOLD_SYMBOL: XAU/USD

          NDX_PROVIDER: yahoo
          NDX_SYMBOL: ^NDX

          ROUNDTRIP_COST_BPS: "14"

          USE_NEWS_BIAS: "false"
          NEWS_BIAS_FILTER: "false"
          NEWS_MODE: warn

      - name: Preserve state and retry queue
        if: always()
        run: |
          if [ ! -f state.json ]; then exit 0; fi

          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"

          # Keep the scanner-produced state outside the worktree while we
          # fast-forward to the latest main. This avoids state.json rebase
          # conflicts when another run persisted state during this run.
          cp state.json /tmp/scanner-state.json
          git restore -- agent.py state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/scanner-state.json state.json

          git add -- state.json
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Persist scanner state and notification queue"
          git push origin HEAD:main

      - name: Recovery copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state.json
          if-no-files-found: ignore
          retention-days: 14
