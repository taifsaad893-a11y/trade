name: market-scanner

on:
  # External cron-job.org dispatch is the verified scheduler.
  push:
    branches:
      - main
    paths-ignore:
      - "state.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Read the latest persisted state after any queued run finishes.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify critical behavior
        if: ${{ hashFiles('tests/test_scanner.py') != '' }}
        run: python -m unittest discover -s tests -v

      - name: Analyze support resistance breakout retest (15m)
        run: |
          python sr_retest_scanner.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          EVENT: ${{ github.event_name }}

          GOLD_SYMBOL: XAU/USD
          NDX_SYMBOL: NQ=F

      - name: Preserve state and retry queue
        if: always()
        run: |
          if [ ! -f state.json ]; then exit 0; fi

          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"

          cp state.json /tmp/scanner-state.json
          git restore -- agent.py state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/scanner-state.json state.json

          git add -- state.json
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Persist scanner state and notification queue"
          git push origin HEAD:main

      - name: Recovery copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state.json
          if-no-files-found: ignore
          retention-days: 14


